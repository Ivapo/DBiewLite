[package]
name = "dbiewlite-tui"
version = "0.1.0"
description = "Terminal UI for DBiewLite — viewer for SQLite, DuckDB, and Parquet files"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ivapo/DBiewLite"
homepage = "https://ivapo.github.io/DBiewLite/"
readme = "README.md"
keywords = ["sqlite", "duckdb", "parquet", "database", "viewer"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "dbiew"
path = "src/main.rs"

[dependencies]
dbiewlite-core = { version = "0.1.0", path = "../dbiewlite-core" }
ratatui = "0.29"
crossterm = "0.28"
dirs = "6"
unicode-width = "0.2"
