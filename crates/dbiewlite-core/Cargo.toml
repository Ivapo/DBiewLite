[package]
name = "dbiewlite-core"
version = "0.2.1"
description = "Shared database operations for DBiewLite (SQLite, DuckDB, Parquet)"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ivapo/DBiewLite"
homepage = "https://ivapo.github.io/DBiewLite/"
readme = "README.md"
keywords = ["sqlite", "duckdb", "parquet", "database", "viewer"]
categories = ["database"]

[dependencies]
rusqlite = { version = "0.34", features = ["bundled"] }
duckdb = { version = "1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
